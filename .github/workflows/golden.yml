name: Golden Tests

# Golden files are generated and compared on Linux only: font rendering differs
# between operating systems, so goldens made on macOS would not match here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate golden files and commit them to the branch
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compare against golden files
        run: flutter test --tags golden

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  update:
    if: ${{ inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Regenerate golden files
        run: flutter test --tags golden --update-goldens

      - name: Commit golden files
        run: |
          git add --all -- '**/goldens/*.png'
          if git diff --cached --quiet; then
            echo "Golden files are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update golden files"
          git push
